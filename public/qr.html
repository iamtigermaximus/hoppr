<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hoppr QR code</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 24px;
    padding: 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
  .qr-wrap {
    background: white;
    border-radius: 16px;
    padding: 16px;
    display: inline-block;
    margin-bottom: 24px;
  }
  .qr-wrap img { display: block; width: 256px; height: 256px; }
  .url-input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 15px;
    text-align: center;
    margin-bottom: 12px;
  }
  .url-input:focus { outline: none; border-color: #6366f1; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
  }
  .btn-primary { background: #6366f1; color: white; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
  .btn-ghost:hover { background: #1e293b; color: #e2e8f0; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="card">
  <h1>hoppr</h1>
  <p class="subtitle">Find your night. Scan to get the app.</p>

  <div class="qr-wrap">
    <img id="qr" src="" alt="QR code linking to hoppr" />
  </div>

  <input
    class="url-input"
    id="url"
    type="text"
    value="https://hoppr.vercel.app"
    placeholder="https://your-app.vercel.app"
  />

  <div class="actions">
    <button class="btn btn-primary" id="update">Update QR</button>
    <button class="btn btn-ghost" id="download">Download PNG</button>
  </div>
</div>

<script>
const qrImg = document.getElementById("qr");
const urlInput = document.getElementById("url");
const updateBtn = document.getElementById("update");
const downloadBtn = document.getElementById("download");

function qrSrc(url) {
  return "https://api.qrserver.com/v1/create-qr-code/?size=300x300&color=000&bgcolor=fff&data="
    + encodeURIComponent(url);
}

function refresh() {
  const url = urlInput.value.trim() || "https://hoppr.vercel.app";
  qrImg.src = qrSrc(url);
}

qrImg.src = qrSrc(urlInput.value);

updateBtn.addEventListener("click", refresh);

downloadBtn.addEventListener("click", async () => {
  const url = urlInput.value.trim() || "https://hoppr.vercel.app";
  const res = await fetch(qrSrc(url));
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hoppr-qr.png";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
