<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0f0a08"/>
      <stop offset="100%" style="stop-color:#080808"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#c9a93c;stop-opacity:0.45"/>
      <stop offset="50%" style="stop-color:#c9a93c;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#c9a93c;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a93c;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c9a93c;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#c9a93c;stop-opacity:0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="big"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="400" cy="180" r="180" fill="url(#glow)"/>
  <polygon points="400,50 470,150 400,250 330,150" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.65" filter="url(#soft)"/>
  <polygon points="400,90 440,150 400,210 360,150" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="200" x2="330" y2="150" stroke="#c9a93c" stroke-width="2" opacity="0.4" filter="url(#soft)"/>
  <line x1="470" y1="150" x2="740" y2="200" stroke="#c9a93c" stroke-width="2" opacity="0.4" filter="url(#soft)"/>
  <circle cx="400" cy="70" r="5" fill="#c9a93c" opacity="0.75" filter="url(#big)"/>
  <circle cx="320" cy="130" r="4" fill="#c9a93c" opacity="0.6" filter="url(#big)"/>
  <circle cx="480" cy="130" r="4" fill="#c9a93c" opacity="0.6" filter="url(#big)"/>
  <circle cx="250" cy="200" r="3.5" fill="#c9a93c" opacity="0.45" filter="url(#big)"/>
  <circle cx="550" cy="200" r="3.5" fill="#c9a93c" opacity="0.45" filter="url(#big)"/>
  <circle cx="400" cy="230" r="2.5" fill="#c9a93c" opacity="0.4" filter="url(#soft)"/>
</svg>