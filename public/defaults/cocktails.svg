<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#140a0f"/>
      <stop offset="50%" style="stop-color:#160d12"/>
      <stop offset="100%" style="stop-color:#0a080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#e11d48;stop-opacity:0.45"/>
      <stop offset="40%" style="stop-color:#be123c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#be123c;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="60%" cy="55%" r="35%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="360" cy="160" r="160" fill="url(#glow)"/>
  <circle cx="480" cy="220" r="140" fill="url(#glow2)"/>
  <ellipse cx="330" cy="150" rx="120" ry="60" fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="380" cy="170" rx="100" ry="50" fill="none" stroke="#e11d48" stroke-width="2" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="430" cy="190" rx="80" ry="40" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.4" filter="url(#soft)"/>
  <circle cx="280" cy="130" r="14" fill="#f43f5e" opacity="0.5" filter="url(#blur)"/>
  <circle cx="500" cy="200" r="10" fill="#f59e0b" opacity="0.4" filter="url(#blur)"/>
  <circle cx="380" cy="300" r="12" fill="#e11d48" opacity="0.35" filter="url(#blur)"/>
  <circle cx="450" cy="130" r="5" fill="#f43f5e" opacity="0.45" filter="url(#soft)"/>
  <circle cx="320" cy="280" r="4" fill="#f59e0b" opacity="0.4" filter="url(#soft)"/>
</svg>